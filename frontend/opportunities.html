<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rubium — Возможности</title>
    <link rel="icon" type="image/png" href="data/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Unbounded:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #0F0F1A;
            --surface: rgba(255,255,255,0.03);
            --surface-hover: rgba(255,255,255,0.06);
            --glass: rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.06);
            --brand: #A78BFA;
            --brand-glow: rgba(167,139,250,0.15);
            --accent: #F472B6;
            --success: #34D399;
            --warning: #FBBF24;
            --danger: #F87171;
            --text: #F1F5F9;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --radius: 24px;
            --radius-sm: 16px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);
            min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;
        }
        body::before{
            content:'';position:fixed;top:-300px;left:-300px;width:800px;height:800px;
            background:radial-gradient(circle,rgba(167,139,250,0.06),transparent 70%);
            pointer-events:none;z-index:0;
        }
        body::after{
            content:'';position:fixed;bottom:-250px;right:-250px;width:700px;height:700px;
            background:radial-gradient(circle,rgba(244,114,182,0.05),transparent 70%);
            pointer-events:none;z-index:0;
        }

        .topbar{
            display:flex;align-items:center;justify-content:space-between;
            padding:16px 32px;border-bottom:1px solid var(--glass-border);
            position:relative;z-index:1;
        }
        .topbar-left{display:flex;align-items:center;gap:16px}
        .back-btn{
            background:none;border:none;color:var(--text-secondary);cursor:pointer;
            font-size:1rem;padding:6px 12px;border-radius:8px;transition:all 0.2s;
            display:flex;align-items:center;gap:8px;font-family:inherit;font-size:0.85rem;
        }
        .back-btn:hover{background:var(--surface-hover);color:var(--text)}
        .page-title{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted);font-family:'JetBrains Mono',monospace}

        .content{
            max-width:1100px;margin:0 auto;padding:24px 32px 32px;position:relative;z-index:1;
        }

        .hero{
            text-align:center;padding:40px 20px 32px;
        }
        .hero h1{
            font-size:2rem;font-weight:800;letter-spacing:-0.5px;margin-bottom:8px;
        }
        .hero h1 span{background:linear-gradient(135deg,var(--brand),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .hero p{color:var(--text-secondary);font-size:0.95rem;max-width:500px;margin:0 auto}

        .tabs{
            display:flex;gap:4px;margin-bottom:24px;background:var(--glass);
            border:1px solid var(--glass-border);border-radius:var(--radius-sm);padding:4px;
        }
        .tab{
            flex:1;padding:10px 16px;border:none;border-radius:12px;background:transparent;
            color:var(--text-secondary);cursor:pointer;font-family:inherit;font-size:0.8rem;
            font-weight:600;transition:all 0.2s;text-align:center;
        }
        .tab:hover{color:var(--text)}
        .tab.active{background:var(--brand-glow);color:var(--brand)}

        .filter-row{
            display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;
        }
        .filter-chip{
            padding:6px 14px;border-radius:20px;border:1px solid var(--glass-border);
            background:transparent;color:var(--text-secondary);cursor:pointer;
            font-family:inherit;font-size:0.75rem;font-weight:500;transition:all 0.2s;
        }
        .filter-chip:hover{border-color:var(--brand);color:var(--text)}
        .filter-chip.active{background:var(--brand-glow);border-color:var(--brand);color:var(--brand)}

        .cards-grid{
            display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;
        }
        .card{
            background:var(--glass);border:1px solid var(--glass-border);
            border-radius:var(--radius);padding:20px;transition:all 0.3s;
            cursor:pointer;
        }
        .card:hover{background:var(--surface-hover);border-color:var(--brand);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.2)}
        .card-badge{
            display:inline-block;padding:3px 10px;border-radius:8px;font-size:0.6rem;
            font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;
            font-family:'JetBrains Mono',monospace;
        }
        .badge-internship{background:rgba(52,211,153,0.15);color:var(--success)}
        .badge-job{background:rgba(167,139,250,0.15);color:var(--brand)}
        .badge-university{background:rgba(251,191,36,0.15);color:var(--warning)}

        .card-title{font-size:1rem;font-weight:700;margin-bottom:6px;line-height:1.4}
        .card-company{font-size:0.85rem;color:var(--brand);margin-bottom:8px}
        .card-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:0.7rem;color:var(--text-muted);margin-bottom:10px}
        .card-meta span{display:flex;align-items:center;gap:4px}
        .card-desc{font-size:0.8rem;color:var(--text-secondary);line-height:1.5;margin-bottom:12px}
        .card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
        .card-tag{font-size:0.6rem;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);color:var(--text-muted)}
        .card-footer{display:flex;justify-content:space-between;align-items:center}
        .card-salary{font-size:0.8rem;font-weight:600;color:var(--text)}
        .card-link{font-size:0.75rem;color:var(--brand);text-decoration:none;font-weight:500}
        .card-link:hover{text-decoration:underline}

        .empty-state{text-align:center;padding:40px 20px;color:var(--text-secondary);grid-column:1/-1}
        .empty-state i{font-size:3rem;color:var(--text-muted);margin-bottom:16px;display:block}

        @media (max-width: 768px) {
            .content{padding:16px}
            .hero h1{font-size:1.4rem}
            .cards-grid{grid-template-columns:1fr}
            .tabs{flex-direction:column}
            .topbar{padding:12px 16px}
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="topbar-left">
        <button class="back-btn" onclick="window.location.href='index.html'">
            <i class="fas fa-arrow-left"></i> Главная
        </button>
        <span class="page-title">Возможности</span>
    </div>
</header>

<div class="content">
    <div class="hero">
        <h1><span>Возможности</span> для тебя</h1>
        <p>Стажировки, работа и университеты — всё в одном месте</p>
    </div>

    <div class="tabs" id="tabs">
        <button class="tab active" data-type="internship">
            <i class="fas fa-rocket"></i> Стажировки
        </button>
        <button class="tab" data-type="job">
            <i class="fas fa-briefcase"></i> Работа
        </button>
        <button class="tab" data-type="university">
            <i class="fas fa-graduation-cap"></i> Университеты
        </button>
    </div>

    <div class="filter-row" id="directionFilters">
        <button class="filter-chip active" data-direction="all">Все направления</button>
        <button class="filter-chip" data-direction="it"><i class="fas fa-code"></i> IT</button>
        <button class="filter-chip" data-direction="engineering"><i class="fas fa-cog"></i> Инженерия</button>
        <button class="filter-chip" data-direction="science"><i class="fas fa-flask"></i> Наука</button>
        <button class="filter-chip" data-direction="design"><i class="fas fa-palette"></i> Дизайн</button>
        <button class="filter-chip" data-direction="marketing"><i class="fas fa-chart-line"></i> Маркетинг</button>
        <button class="filter-chip" data-direction="finance"><i class="fas fa-coins"></i> Финансы</button>
    </div>

    <div class="cards-grid" id="cardsGrid">
        <div class="empty-state">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Загружаем возможности...</p>
        </div>
    </div>
</div>

<script>
    const API_BASE = 'http://localhost:5080/ai/v1';
    let allData = [];
    let currentType = 'internship';
    let currentDirection = 'all';

    const TYPE_NAMES = {
        internship: 'Стажировка',
        job: 'Работа',
        university: 'Университет'
    };
    const TYPE_ICONS = {
        internship: 'fa-rocket',
        job: 'fa-briefcase',
        university: 'fa-graduation-cap'
    };
    const BADGE_CLASSES = {
        internship: 'badge-internship',
        job: 'badge-job',
        university: 'badge-university'
    };

    async function loadData() {
        try {
            const res = await fetch(`${API_BASE}/opportunities?limit=100`);
            const data = await res.json();
            allData = data.opportunities || [];
            renderCards();
        } catch (e) {
            document.getElementById('cardsGrid').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>Не удалось загрузить данные</p>
                </div>`;
        }
    }

    function filterData() {
        let result = allData;
        if (currentType) {
            result = result.filter(o => o.type === currentType);
        }
        if (currentDirection && currentDirection !== 'all') {
            result = result.filter(o => o.direction === currentDirection);
        }
        return result;
    }

    function renderCards() {
        const grid = document.getElementById('cardsGrid');
        const items = filterData();

        if (items.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-search"></i>
                    <p>Ничего не найдено по выбранным фильтрам</p>
                </div>`;
            return;
        }

        grid.innerHTML = items.map(item => `
            <div class="card" onclick="window.open('${item.url}', '_blank')">
                <div class="card-badge ${BADGE_CLASSES[item.type] || 'badge-job'}">
                    ${TYPE_NAMES[item.type] || item.type}
                </div>
                <div class="card-title">${item.title}</div>
                <div class="card-company">
                    <i class="fas fa-building"></i> ${item.company}
                </div>
                <div class="card-meta">
                    <span><i class="fas fa-map-marker-alt"></i> ${item.city || '—'}</span>
                    <span><i class="fas fa-clock"></i> ${item.date_posted || ''}</span>
                </div>
                <div class="card-desc">${(item.description || '').slice(0, 200)}</div>
                <div class="card-tags">${(item.tags || []).slice(0, 4).map(t => `<span class="card-tag">${t}</span>`).join('')}</div>
                <div class="card-footer">
                    <span class="card-salary">${item.salary || ''}</span>
                    <a href="${item.url}" target="_blank" class="card-link" onclick="event.stopPropagation()">
                        Подробнее <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            </div>
        `).join('');
    }

    // Tabs
    document.getElementById('tabs').addEventListener('click', function(e) {
        if (e.target.classList.contains('tab') || e.target.parentElement.classList.contains('tab')) {
            const tab = e.target.classList.contains('tab') ? e.target : e.target.parentElement;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentType = tab.dataset.type;
            renderCards();
        }
    });

    // Direction filters
    document.getElementById('directionFilters').addEventListener('click', function(e) {
        if (e.target.classList.contains('filter-chip') || e.target.parentElement.classList.contains('filter-chip')) {
            const chip = e.target.classList.contains('filter-chip') ? e.target : e.target.parentElement;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            currentDirection = chip.dataset.direction;
            renderCards();
        }
    });

    loadData();
</script>
</body>
</html>
