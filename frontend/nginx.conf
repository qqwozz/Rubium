server {
    listen 80;
    server_name rubium.tech localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name rubium.tech localhost;

    ssl_certificate /etc/letsencrypt/live/rubium.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rubium.tech/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://rubium_api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /health {
        proxy_pass http://rubium_api:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}